<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  .wrap{width:512px;height:512px;overflow:hidden}
</style></head>
<body>
<div class="wrap">
  <svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"  stop-color="#FF5E8A"/>
        <stop offset="45%" stop-color="#E1306C"/>
        <stop offset="100%" stop-color="#7B2FF0"/>
      </linearGradient>
      <radialGradient id="glow" cx="28%" cy="22%" r="70%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
        <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#3A0B4E" flood-opacity="0.30"/>
      </filter>
    </defs>

    <!-- background -->
    <rect width="512" height="512" rx="0" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>

    <!-- subtle droplet accent -->
    <path d="M256 70 C188 188 150 224 150 296 a106 106 0 1 0 212 0 C362 224 324 188 256 70 Z"
          fill="#FFFFFF" opacity="0.12"/>

    <!-- download / drop glyph -->
    <g fill="none" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
      <line x1="256" y1="150" x2="256" y2="312"/>
      <polyline points="184,256 256,330 328,256"/>
      <line x1="160" y1="392" x2="352" y2="392"/>
    </g>
  </svg>
</div>
</body></html>
